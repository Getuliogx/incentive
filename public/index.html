<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incentive Meta Web Service</title>
<style>
body{font-family:Arial,sans-serif;background:#0e1620;color:#eef4fb;margin:0;padding:32px}main{max-width:850px;margin:auto;background:#16222e;border:1px solid #2d3d4d;border-radius:16px;padding:28px}code{background:#0b1118;padding:3px 7px;border-radius:6px}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#0b1118;color:#fff;border:1px solid #42566b;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer}img{max-width:100%;margin-top:16px;border-radius:10px}.ok{color:#71e48c}.bad{color:#ff8585}</style>
</head>
<body><main>
<h1>Incentive Meta — Web Service</h1>
<p id="status">Verificando...</p>
<p>Teste a imagem 1920×1080 antes do chat:</p>
<input id="title" value="Pokémon" placeholder="Nome da série/anime">
<input id="season" value="1" placeholder="Temporada">
<button onclick="preview()">Testar imagem</button>
<pre id="out"></pre><img id="img" alt="">
<script>
fetch('/health').then(r=>r.json()).then(j=>status.innerHTML='<span class="ok">ONLINE</span> — versão '+j.version).catch(()=>status.innerHTML='<span class="bad">ERRO</span>');
async function preview(){const t=title.value.trim(),s=season.value.trim();const u='/api/preview?title='+encodeURIComponent(t)+(s?'&season='+encodeURIComponent(s):'');const r=await fetch(u),j=await r.json();out.textContent=JSON.stringify(j,null,2);img.src=j.image1920x1080||''}
</script>
</main></body>
</html>
